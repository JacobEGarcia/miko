<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miko - nine-direction avatar</title>
<style>
  :root { --bg:#faf9f6; --ink:#2b2926; --muted:#8a857e; --accent:#b3776b; --line:#e8e4de; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage { position:relative; width:min(78vw,460px); aspect-ratio:1/1; }
  .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
               opacity:0; transition:opacity .28s ease; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .stage img.on { opacity:1; }
  h1 { font-size:1.15rem; font-weight:600; letter-spacing:.02em; margin-top:1.6rem; }
  p.sub { color:var(--muted); font-size:.85rem; margin-top:.4rem; }
  .hint { margin-top:1.1rem; font-size:.78rem; color:var(--muted); border:1px solid var(--line);
          padding:.45rem .9rem; border-radius:999px; }
  footer { margin-top:2.2rem; font-size:.72rem; color:var(--muted); text-align:center; line-height:1.7; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Miko turns to follow your cursor">
  <img data-d="up-left"    src="up-left.webp"    alt="">
  <img data-d="up"         src="up.webp"         alt="">
  <img data-d="up-right"   src="up-right.webp"   alt="">
  <img data-d="left"       src="left-green.webp" alt="">
  <img data-d="front"      src="front.webp"      alt="" class="on">
  <img data-d="right"      src="right.webp"      alt="">
  <img data-d="down-left"  src="down-left.webp"  alt="">
  <img data-d="down"       src="down.webp"       alt="">
  <img data-d="down-right" src="down-right.webp" alt="">
</div>
<h1>Miko follows you</h1>
<p class="sub">Nine-direction head turns, cut from a single layered PSD character.</p>
<div class="hint" id="hint">Move your cursor - she watches it</div>
<footer>
  Character: Miko &copy; Yuki Shindo (AITuber OnAir) - used per the Miko character guidelines.<br>
  Built with assets from <a href="https://github.com/shinshin86/psd-motion-lab">psd-motion-lab</a>,
  inspired by <a href="https://github.com/852wa/Anime2.5DRig">Anime2.5DRig</a> (hakoniwa).
</footer>
<script>
const stage = document.getElementById('stage');
const imgs = [...stage.querySelectorAll('img')];
const hint = document.getElementById('hint');
if (matchMedia('(pointer: coarse)').matches) hint.textContent = 'Drag a finger - she watches it';
let current = 'front';
function dirFrom(nx, ny) {
  // dead zone in the middle keeps her facing front
  const ax = Math.abs(nx), ay = Math.abs(ny);
  if (ax < .28 && ay < .30) return 'front';
  const x = nx < -.28 ? 'left' : nx > .28 ? 'right' : '';
  const y = ny < -.30 ? 'up'   : ny > .30 ? 'down' : '';
  return [y, x].filter(Boolean).join('-') || 'front';
}
function show(d) {
  if (d === current) return;
  current = d;
  imgs.forEach(im => im.classList.toggle('on', im.dataset.d === d));
}
function point(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  const nx = (clientX - (r.left + r.width/2))  / (r.width/2);
  const ny = (clientY - (r.top  + r.height/2)) / (r.height/2);
  show(dirFrom(Math.max(-1,Math.min(1,nx)), Math.max(-1,Math.min(1,ny))));
}
addEventListener('mousemove', e => { hint.style.opacity = .4; point(e.clientX, e.clientY); });
addEventListener('touchmove', e => { hint.style.opacity = .4; point(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
addEventListener('mouseleave', () => show('front'));
imgs.forEach(im => { const i = new Image(); i.src = im.src; });
</script>
</body>
</html>
